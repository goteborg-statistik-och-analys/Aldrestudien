  <script>  (function() {
    function initDiagram_dropdown_99931() {
      var container = document.getElementById('dropdown_99931_container');
      var menuBtn = document.getElementById('dropdown_99931_menu');
      var menuContent = document.getElementById('dropdown_99931_content');
      var fullscreenBtn = document.getElementById('dropdown_99931_fullscreen');
      
      if (!container || !menuBtn || !menuContent || !fullscreenBtn) {
        setTimeout(initDiagram_dropdown_99931, 100);
        return;
      }
      
      // Dropdown-funktionalitet
      menuBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (menuContent.style.display === 'none' || menuContent.style.display === '') {
          menuContent.style.display = 'block';
        } else {
          menuContent.style.display = 'none';
        }
      });
      
      document.addEventListener('click', function(event) {
        if (!menuBtn.contains(event.target) && !menuContent.contains(event.target)) {
          menuContent.style.display = 'none';
        }
      });
      
      // Helskärm-funktionalitet
      fullscreenBtn.addEventListener('click', function() {
        if (!document.fullscreenElement) {
          if (container.requestFullscreen) {
            container.requestFullscreen();
          } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
          } else if (container.msRequestFullscreen) {
            container.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });
      
      // Hantera helskärmsläge
      function handleFullscreenChange() {
        var girafeDiv = document.getElementById('dropdown_99931_girafe');
        
        if (document.fullscreenElement === container || 
            document.webkitFullscreenElement === container ||
            document.mozFullScreenElement === container) {
          // I helskärm
          container.style.height = '100vh';
          container.style.width = '100vw';
          container.style.background = 'white';
          container.style.overflow = 'auto';
          container.style.padding = '20px';
          
          var girafeContainer = girafeDiv.querySelector('.girafe_container_std');
          if (girafeContainer) {
            girafeContainer.style.maxWidth = '100%';
            girafeContainer.style.height = 'auto';
          }
        } else {
          // Ute ur helskärm
          container.style.height = '';
          container.style.width = '';
          container.style.background = '';
          container.style.overflow = '';
          container.style.padding = '';
          
          var girafeContainer = girafeDiv.querySelector('.girafe_container_std');
          if (girafeContainer) {
            girafeContainer.style.maxWidth = '';
            girafeContainer.style.height = '';
          }
        }
      }
      
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
      document.addEventListener('mozfullscreenchange', handleFullscreenChange);
      document.addEventListener('MSFullscreenChange', handleFullscreenChange);
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDiagram_dropdown_99931);
    } else {
      initDiagram_dropdown_99931();
    }
  })();</script>
